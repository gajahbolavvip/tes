
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockfolio | PLTR & INTC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
    }

    header {
      padding: 24px 6%;
      border-bottom: 1px solid #263248;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #94a3b8;
      margin-bottom: 0;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px 16px;
    }

    .stocks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .stock {
      background: #111c30;
      border: 1px solid #263248;
      border-radius: 14px;
      padding: 18px;
      min-width: 0;
    }

    .stock h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .stock p {
      color: #94a3b8;
      margin: 0 0 18px;
    }

    .chart {
      height: 480px;
      width: 100%;
    }

    .note {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 24px;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #64748b;
      border-top: 1px solid #263248;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .stocks {
        grid-template-columns: 1fr;
      }

      .chart {
        height: 420px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>📈 Stockfolio</h1>
    <p>Live market dashboard · NASDAQ</p>
  </header>

  <main>
    <div class="stocks">

      <section class="stock">
        <h2>PLTR</h2>
        <p>Palantir Technologies</p>
        <div id="chart-pltr" class="chart"></div>
      </section>

      <section class="stock">
        <h2>INTC</h2>
        <p>Intel Corporation</p>
        <div id="chart-intc" class="chart"></div>
      </section>

    </div>

    <p class="note">
      Data dan grafik disediakan oleh TradingView.
      Harga dapat tertunda bergantung pada akses data bursa.
      Informasi ini untuk pemantauan pasar, bukan saran investasi.
    </p>
  </main>

  <footer>
    Stockfolio © 2026 · PLTR & INTC
  </footer>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    function buatGrafik(simbol, container) {
      new TradingView.widget({
        autosize: true,
        symbol: "NASDAQ:" + simbol,
        interval: "D",
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "en",
        enable_publishing: false,
        allow_symbol_change: false,
        hide_top_toolbar: false,
        hide_legend: false,
        save_image: false,
        withdateranges: true,
        details: true,
        container_id: container
      });
    }

    buatGrafik("PLTR", "chart-pltr");
    buatGrafik("INTC", "chart-intc");
  </script>
</body>
</html>
